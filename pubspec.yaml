name: dream_watch
description: "Đồng hồ mộng mơ - hiển thị giờ phút giây bằng hình ảnh tự chọn."
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.2
  file_picker: ^8.1.2
  audioplayers: ^6.1.0
  wakelock_plus: ^1.2.8
  image: ^4.2.0
  web: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
    - assets/themes/khung_long/
