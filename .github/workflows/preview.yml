# Nhánh thử nghiệm: chạy kiểm tra + vẽ ảnh xem trước, KHÔNG đưa lên web.
name: Preview (nhánh thử nghiệm)

on:
  push:
    branches: [dev]

permissions:
  contents: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create . --project-name dream_watch --platforms=web
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
        continue-on-error: true
      - run: flutter test
      # Đẩy ảnh xem trước lên nhánh riêng "preview-images" để xem được ngay
      - name: Lưu ảnh xem trước
        if: always()
        run: |
          mkdir -p /tmp/out && cp -r build/preview/. /tmp/out/ 2>/dev/null || true
          cd /tmp/out
          git init -q
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "preview ${GITHUB_SHA::7}" || exit 0
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/preview-images
      # Bản web dựng sẵn (để Claude quay video giới thiệu trên máy riêng)
      - name: Build web cho quay video
        run: flutter build web --release --no-web-resources-cdn --base-href / --dart-define=BUILD_VERSION=dev-$(git log -1 --format=%h)
      - name: Lưu bản web vào nhánh "web-build"
        run: |
          cd build/web
          git init -q
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "web build ${GITHUB_SHA::7}"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/web-build
