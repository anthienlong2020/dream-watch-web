# Mỗi lần có code mới đẩy lên nhánh main: GitHub tự build bản web và đưa lên
# GitHub Pages. Không cần máy tính.
name: Build web & deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Tạo thư mục web (nếu thiếu)
        run: flutter create . --project-name dream_watch --platforms=web
      - run: flutter pub get
      - run: flutter test
      - run: flutter build web --release --base-href /dream-watch-web/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
